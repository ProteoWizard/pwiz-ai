<!-- Code by Yuval Boss yuval(at)uw.edu -->
<!-- Enhanced 2026-07: Time Diff moved to its own secondary y-axis (in seconds) so a large
     time gap no longer flattens the memory scale; memory (MB) and time-gap (sec) axes labeled. -->
<!-- Enhanced 2026-11: two panes on one time axis, as perfviz.py --png draws them - memory
     (and disk, from an optional pasted CSV) above, the log gap between lines below. At cohort
     scale the gap trace on the memory chart's second axis hid the memory lines entirely.
     Zooming either pane zooms both. -->
<html>
<head>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.4.11/c3.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/c3/0.4.11/c3.min.js"></script>
<script type="text/javascript">
	function isBlank(str) {
	    return (!str || /^\s*$/.test(str));
	}
	// Disk samples pasted as CSV: a header row, the time (yyyy-MM-dd HH:mm:ss) first and a
	// dir_gb column (run directory size in GB) - what the Osprey disk sampler writes. A stopgap
	// until disk use is stamped into the log beside the memory columns.
	function parseDisk(text) {
		var xs = ['xdisk'], gb = ['Disk (GB)'];
		var lines = text.split("\n").filter(function (l) { return !isBlank(l); });
		if (lines.length < 2)
			return null;
		var header = lines[0].split(',').map(function (h) { return h.trim(); });
		var col = header.indexOf('dir_gb');
		if (col < 0) {
			console.log("ERROR: disk CSV has no dir_gb column");
			return null;
		}
		for (var i = 1; i < lines.length; i++) {
			var parts = lines[i].split(',');
			var t = new Date(parts[0].trim().replace(' ', 'T')).getTime();
			if (isNaN(t) || parts.length <= col)
				continue;
			xs.push(t);
			gb.push(parseFloat(parts[col]));
		}
		return xs.length > 1 ? { xs: xs, gb: gb } : null;
	}
	var messages = {};
	$( document ).ready(function() {
	    $( "#loginput" ).submit(function( event ) {
	  		event.preventDefault();
	  		var logLines = $('#logtext').val().split("\n");
            var hasMemStamps = false;
	  		if($('#logtext').val().length == 0 || logLines.length == 0) {
	  			console.log("ERROR: No log given")
	  			return;
	  		}
	  		var dates = ['x'];
	  		var difference = ['Time Diff'];
	  		var managedMems = ['Managed Memory'];
	  		var totalMems = ['Total Memory'];
	  		// Detect memstamp format from ANY bracketed line with tab-delimited columns, so a log
	  		// that begins with non-memstamp preamble (e.g. a launcher banner) still charts memory.
	  		for(var s = 0; s < logLines.length; s++) {
	  			var ps = logLines[s].match(/\[(.*?)\](.*)/);
	  			if (ps && ps[2].split('\t').length > 2) { hasMemStamps = true; break; }
	  		}
	  		var dateBefore;
	  		var lastTime = 0; // strictly-increasing x tiebreak so same-second lines don't collapse
	  		for(var i = 0; i < logLines.length; i++) {
	  			var line = logLines[i];
	  			if(isBlank(line))
	  				continue;
	  			var parsed = line.match(/\[(.*?)\](.*)/);
	  			if (parsed == null || parsed.length < 2) {
	  				console.log(parsed + "NOT VALID")
	  				continue;
	  			}
	  			var date = parsed[1];
	  			var text = parsed[2];
	  			var items = text.split('\t');
	  			// With memstamps, skip lines carrying no memory columns (preamble / interstitial).
	  			if(hasMemStamps && items.length <= 2)
	  				continue;
	  			if(dateBefore == null) {
	  				dateBefore = date;
	  				continue;
	  			}
	  			var message = "";
	  			var avgMem = 0;
	  			var totalMem = 0;
                if (hasMemStamps) {
	  			    avgMem = items[1];
	  			    totalMem = items[2];
    	  			if(items.length>3)
	      				message = items[3];
                }
                else {
                    message = text.substring(1);
                }
	  			var diff = (new Date(date).getTime() - new Date(dateBefore).getTime())/1000; // time gap in seconds (its own pane)
	  			// Keep x strictly increasing: the log is second-resolution, so multiple events in
	  			// one second (e.g. 84 per-file result lines at the same timestamp) would collapse
	  			// onto one x and drop points. Bump 1ms per duplicate; Time Diff above still uses the
	  			// true second gap (0 for same-second lines).
	  			var t = new Date(date).getTime();
	  			if (t <= lastTime) t = lastTime + 1;
	  			lastTime = t;
	  			difference.push(diff);
	  			dates.push(t);
	  			managedMems.push(avgMem);
	  			totalMems.push(totalMem);
	  			messages[t] = (message);
	  			dateBefore = date;
	  		}

            var disk = parseDisk($('#disktext').val());
            var height = Math.max(400, window.innerHeight - 300); // fill the viewport below the inputs
            // A fixed tick count: left to itself c3 draws a tick per sample, a solid band at
            // cohort scale.
            var xTick = { type: 'timeseries', tick: { format: '%H:%M:%S', count: 12 } };
            // The same fixed padding on both panes, so their plot areas - and time axes - line
            // up whatever width each pane's axis labels need.
            var padding = { left: 70, right: 70 };
            var title = function (d) {
                var str = d.getHours() + ":" + d.getMinutes() + ":" + d.getSeconds();
                var msg = messages[d.getTime()];
                return msg === undefined ? str : str + " - " + msg;
            };
            var gapChart;
            var syncing = false;
            // Zooming one pane zooms the other, so the gap under a memory spike stays in view.
            function syncZoom(other) {
                return function (domain) {
                    if (syncing || !other())
                        return;
                    syncing = true;
                    other().zoom(domain);
                    syncing = false;
                };
            }

            // Top pane: memory, and disk on y2 when a disk CSV was pasted. Without memstamps
            // there is nothing to draw here, so the gap pane is the whole chart.
            var memChart = null;
            if (hasMemStamps) {
                var cols = [ dates, managedMems, totalMems ];
                var xsMap = { 'Managed Memory': 'x', 'Total Memory': 'x' };
                var axes = {};
                if (disk) {
                    cols.push(disk.xs, disk.gb);
                    xsMap['Disk (GB)'] = 'xdisk';
                    axes['Disk (GB)'] = 'y2';
                }
                memChart = c3.generate({
                    bindto: '#chart',
                    data: { xs: xsMap, columns: cols, axes: axes,
                            colors: { 'Managed Memory': '#ff7f0e', 'Total Memory': '#2ca02c', 'Disk (GB)': '#d62728' } },
                    point: { show: false },
                    padding: padding,
                    size: { height: Math.round(height * 0.72) },
                    zoom: { enabled: true, onzoom: syncZoom(function () { return gapChart; }) },
                    axis: {
                        x: xTick,
                        y: { label: { text: 'Memory (MB)', position: 'outer-middle' } },
                        y2: { show: !!disk, label: { text: 'Disk (GB)', position: 'outer-middle' } }
                    },
                    tooltip: { format: { title: title,
                        value: function (value, ratio, id) { return id == 'Disk (GB)' ? value + "gb" : value + "mb"; } } }
                });
            }
            // Bottom pane: the gap between log lines, with the 30 s threshold perfviz.py flags.
            gapChart = c3.generate({
                bindto: '#gapchart',
                data: { x: 'x', columns: [ dates, difference ], colors: { 'Time Diff': '#1f77b4' } },
                point: { show: false },
                padding: padding,
                size: { height: hasMemStamps ? Math.round(height * 0.28) : height },
                zoom: { enabled: true, onzoom: syncZoom(function () { return memChart; }) },
                grid: { y: { lines: [ { value: 30, text: '30 s', class: 'gap-threshold' } ] } },
                axis: {
                    x: xTick,
                    y: { min: 0, padding: { bottom: 0 }, label: { text: 'Time gap (sec)', position: 'outer-middle' } }
                },
                tooltip: { format: { title: title, value: function (value) { return value + "sec"; } } }
            });
		});
	});
</script>
<style>
	.c3-ygrid-line.gap-threshold line { stroke: #d62728; stroke-dasharray: 3 3; }
	.c3-ygrid-line.gap-threshold text { fill: #d62728; }
</style>
</head>
<body style="margin:8px;">
<form id="loginput">
  <textarea id="logtext" placeholder="Paste a --timestamp --memstamp log" style="width:100%; height:120px; box-sizing:border-box; font-family:monospace; font-size:12px;"></textarea>
  <textarea id="disktext" placeholder="Optional: paste a disk CSV (time,dir_gb,...) to plot disk use on the memory pane" style="width:100%; height:48px; margin-top:4px; box-sizing:border-box; font-family:monospace; font-size:12px;"></textarea>
  <div style="margin-top:4px;"><input type="submit" value="Submit"></div>
</form>
<div id="chart"></div>
<div id="gapchart"></div>
</body>
</html>
